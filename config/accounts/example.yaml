# Mẫu cấu hình một tài khoản. Copy thành main.yaml / farm01.yaml ... và sửa.
# Các file khác trong thư mục này KHÔNG được commit (đã có trong .gitignore).

# Tên định danh tài khoản (dùng trong log và thông báo)
name: example

# Vai trò: main (nhận vàng) hoặc farm (cày và chuyển vàng về main)
role: farm

# Instance LDPlayer gắn với tài khoản này
ldplayer:
  # Index instance trong ldconsole (ldconsole list2). ĐỂ TRỐNG (null) = acc chưa
  # có máy -> bấm "Cấp máy mới" trên GUI để clone instance mẫu và tự gán index.
  # Mac/AVD (manage_instances: false) không dùng trường này.
  index: null
  # Serial ADB của instance
  adb_serial: emulator-5554

# Thông tin đăng nhập (server + tài khoản 3CID)
login:
  server: ''
  # Tài khoản/mật khẩu 3CID. ĐỂ TRỐNG cả hai = dùng thông tin đã lưu sẵn
  # trong form SDK trên instance đó ("Save Account Information")
  username: ''
  password: ''
  # Slot nhân vật trên màn "Chọn nhân vật" (1 = trên cùng)
  character_slot: 1

# Tham số farm RIÊNG của tài khoản này. Mặc định chung cho mọi acc nằm ở
# settings.yaml mục account_defaults.farm (sửa qua GUI "Cài đặt chung").
# Chỉ ghi ở đây trường nào muốn KHÁC mặc định; trường bỏ trống = dùng chung.
# Các trường có thể ghi đè: map, spot, hp_retreat_percent, hp_resume_percent,
# retreat_map, retreat_spot, gold_transfer_threshold, gold_keep.
farm:
  # Tên map cày, đúng như hiển thị trong game ('' = lấy theo cài đặt chung)
  map: ''
  # Ngưỡng vàng chuyển về main (đơn vị = transfer.currency trong settings.yaml)
  gold_transfer_threshold: 1000000
