<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHTK2 Quản Lý</title>
<style>
  :root {
    --bg: #141a17;        /* đá ngọc tối — nền game */
    --panel: #1c2420;
    --panel-2: #212b26;
    --line: #2e3a33;
    --ink: #e4e0d1;       /* ngà giấy dó */
    --ink-dim: #9aa397;
    --gold: #c9a24b;      /* vàng đồng — hành động chính */
    --gold-ink: #16130a;
    --jade: #5fa37a;      /* an toàn */
    --amber: #d08f3e;     /* cẩn trọng */
    --red: #c84b3b;       /* nguy hiểm */
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
  }
  button { font: inherit; cursor: pointer; }
  input, select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 1px;
  }
  .app { display: flex; height: 100vh; }

  /* ---- rail trái: danh sách tài khoản ---- */
  .rail {
    width: 272px; flex: none; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 18px 16px 10px; border-bottom: 1px solid var(--line); }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .brand p { margin: 2px 0 0; color: var(--ink-dim); font-size: 12.5px; }
  .brand h1 b { color: var(--gold); font-weight: 600; }
  nav.tabs { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  nav.tabs button {
    flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-dim);
  }
  nav.tabs button.on { background: var(--panel-2); color: var(--ink); border-color: var(--gold); }
  .acc-list { overflow: auto; flex: 1; padding: 8px; }
  .acc-item {
    width: 100%; text-align: left; background: transparent; color: var(--ink);
    border: 1px solid transparent; border-radius: 8px; padding: 9px 10px; margin-bottom: 4px;
  }
  .acc-item:hover { background: var(--panel-2); }
  .acc-item.on { background: var(--panel-2); border-color: var(--gold); }
  .acc-item .nm { font-weight: 600; }
  .acc-item .meta { color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono); }
  .acc-item .role { float: right; font-size: 11.5px; padding: 1px 8px; border-radius: 10px; }
  .role.main { background: #3a2f16; color: var(--gold); }
  .role.farm { background: #1e3328; color: var(--jade); }
  .acc-item.broken .nm { color: var(--red); }
  .rail-foot { padding: 10px 12px; border-top: 1px solid var(--line); }
  .btn {
    border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2);
    color: var(--ink); padding: 8px 14px;
  }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
  .btn.danger { color: var(--red); border-color: #5a2d26; background: transparent; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---- khung phải ---- */
  .main { flex: 1; overflow: auto; }
  .page { max-width: 640px; padding: 26px 32px 120px; }
  .page h2 { margin: 0 0 2px; font-size: 20px; font-weight: 600; }
  .page > p.lead { margin: 0 0 20px; color: var(--ink-dim); font-size: 13.5px; }
  fieldset {
    border: 1px solid var(--line); border-radius: 10px; margin: 0 0 18px; padding: 14px 16px 16px;
    background: var(--panel);
  }
  legend { padding: 0 8px; color: var(--gold); font-size: 13.5px; }
  .row { display: flex; gap: 14px; }
  .row > label { flex: 1; }
  label { display: block; margin-bottom: 10px; font-size: 13.5px; color: var(--ink-dim); }
  label > span { display: block; margin-bottom: 4px; }
  label .hint { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .pw-wrap { position: relative; }
  .pw-wrap button {
    position: absolute; right: 6px; top: 5px; background: none; border: 0; color: var(--ink-dim);
    font-size: 12.5px; padding: 3px 6px;
  }
  .savebar {
    position: fixed; bottom: 0; left: 272px; right: 0;
    background: color-mix(in srgb, var(--panel) 92%, black); border-top: 1px solid var(--line);
    padding: 12px 32px; display: flex; gap: 10px; align-items: center;
  }
  .savebar .msg { color: var(--ink-dim); font-size: 13.5px; flex: 1; }
  .savebar .msg.ok { color: var(--jade); }
  .savebar .msg.err { color: var(--red); white-space: pre-line; }

  /* ---- dải trạng thái bảo vệ (điểm nhấn duy nhất) ---- */
  .seal {
    border-radius: 10px; padding: 16px 18px; margin-bottom: 20px;
    border: 1px solid; font-size: 15px;
  }
  .seal b { display: block; font-size: 17px; margin-bottom: 2px; }
  .seal.safe   { background: #16251d; border-color: var(--jade); color: #bfe3cd; }
  .seal.warn   { background: #2a2113; border-color: var(--amber); color: #ecd3a8; }
  .seal.danger { background: #2a1512; border-color: var(--red);  color: #f0b8ae; }

  .toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--ink); }
  .toggle input { width: auto; accent-color: var(--gold); transform: scale(1.25); }
  .toggle .sub { color: var(--ink-dim); font-size: 12.5px; display: block; }

  .empty { color: var(--ink-dim); padding: 40px 32px; max-width: 520px; }
  .empty h2 { color: var(--ink); }
  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; min-width: 320px;
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  @media (max-width: 760px) {
    .app { flex-direction: column; } .rail { width: 100%; height: 40vh; }
    .savebar { left: 0; } .page { padding: 20px 16px 120px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .acc-item, .btn { transition: background .12s ease, border-color .12s ease; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>VHTK2 <b>Quản Lý</b></h1>
      <p>Cấu hình tài khoản &amp; an toàn</p>
    </div>
    <nav class="tabs">
      <button id="tabAcc" class="on">Tài khoản</button>
      <button id="tabDev">Thiết bị</button>
      <button id="tabSkill">Chiêu</button>
      <button id="tabSafe">An toàn</button>
    </nav>
    <div class="acc-list" id="accList"></div>
    <div class="rail-foot">
      <button class="btn gold wide" id="btnNew">Thêm tài khoản</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="dlgNew">
  <form method="dialog">
    <label><span>Tên file tài khoản (không dấu, vd <code>farm01</code>)</span>
      <input id="newStem" pattern="[A-Za-z0-9_-]{1,64}" required autocomplete="off">
    </label>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px">
      <button class="btn" value="cancel">Huỷ</button>
      <button class="btn gold" id="dlgNewOk" value="ok">Tạo</button>
    </div>
  </form>
</dialog>

<dialog id="dlgPick" style="max-width:none">
  <p style="margin:0 0 10px; color:var(--ink-dim); font-size:13.5px" id="pickMsg">
    Click lên ảnh để chọn điểm tap. Ảnh là màn hình thiết bị NGAY LÚC NÀY —
    hãy mở sẵn màn bản đồ đúng map trong game trước.
  </p>
  <div style="position:relative; line-height:0">
    <img id="pickImg" alt="screenshot" style="max-width:min(960px,88vw); cursor:crosshair; border-radius:6px">
    <div id="pickDot" style="position:absolute; width:14px; height:14px; border:2px solid var(--gold);
         border-radius:50%; transform:translate(-50%,-50%); display:none; pointer-events:none"></div>
  </div>
  <div style="display:flex; gap:10px; justify-content:space-between; margin-top:12px; align-items:center">
    <span id="pickXY" style="font-family:var(--mono); color:var(--ink-dim); font-size:13px"></span>
    <span style="display:flex; gap:10px">
      <button class="btn" id="pickRefresh" type="button">Chụp lại</button>
      <button class="btn" id="pickCancel" type="button">Huỷ</button>
      <button class="btn gold" id="pickOk" type="button" disabled>Dùng điểm này</button>
    </span>
  </div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const api = async (method, url, body) => {
  const res = await fetch(url, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw data;
  return data;
};
const errText = (e) => Array.isArray(e.detail)
  ? e.detail.map((d) => `${d.field}: ${d.message}`).join("\n")
  : (e.detail || e.message || "Lỗi không xác định");

let accounts = [];
let current = null;   // stem đang mở
let tab = "acc";

async function refreshList(keep = true) {
  accounts = await api("GET", "/api/accounts");
  const list = $("#accList");
  list.innerHTML = "";
  for (const a of accounts) {
    const b = document.createElement("button");
    b.className = "acc-item" + (a.error ? " broken" : "") + (a.stem === current ? " on" : "");
    b.innerHTML = a.error
      ? `<span class="nm">${a.stem}</span><span class="meta">file lỗi — mở để xem</span>`
      : `<span class="role ${a.role}">${a.role}</span><span class="nm">${a.name}</span>
         <span class="meta">${a.adb_serial} · máy #${a.ldplayer_index}</span>`;
    b.onclick = () => switchTab("acc", () => openAccount(a.stem));
    list.appendChild(b);
  }
  if (!keep || (current && !accounts.some((a) => a.stem === current))) current = null;
}

function field(label, path, value, opts = {}) {
  const type = opts.type || "text";
  const hint = opts.hint ? `<span class="hint">${opts.hint}</span>` : "";
  if (type === "password") {
    return `<label><span>${label}</span>
      <span class="pw-wrap"><input data-path="${path}" type="password" value="${value ?? ""}">
      <button type="button" class="pw-eye">hiện</button></span>${hint}</label>`;
  }
  return `<label><span>${label}</span>
    <input data-path="${path}" type="${type}" value="${value ?? ""}" ${opts.step ? `step="${opts.step}"` : ""}>${hint}</label>`;
}

function mapSelect(label, path, value, maps, hint) {
  // chỉ liệt kê map ĐÃ đủ template (chọn là chắc chắn chạy được);
  // giá trị hiện tại không nằm trong danh sách thì vẫn hiện kèm cảnh báo
  const known = maps.some((m) => m.name === value);
  const opts = maps.map((m) =>
    `<option value="${m.name}" ${m.name === value ? "selected" : ""}>${m.name}</option>`).join("");
  const stray = value && !known
    ? `<option value="${value}" selected>⚠ ${value} — thiếu template</option>` : "";
  const empty = !value ? `<option value="" selected disabled>— chọn map —</option>` : "";
  return `<label><span>${label}</span>
    <select data-path="${path}">${empty}${stray}${opts}</select>
    <span class="hint">${hint}</span></label>`;
}

function renderAccount(acc, maps) {
  $("#main").innerHTML = `
  <div class="page">
    <h2>${acc.name || acc.stem}</h2>
    <p class="lead">File <code>config/accounts/${acc.stem}.yaml</code> — lưu là ghi thẳng vào file, giữ nguyên chú thích.</p>
    <fieldset><legend>Định danh</legend>
      <div class="row">
        ${field("Tên hiển thị (log, thông báo)", "name", acc.name)}
        <label><span>Vai trò</span>
          <select data-path="role">
            <option value="farm" ${acc.role === "farm" ? "selected" : ""}>farm — cày và chuyển vàng về main</option>
            <option value="main" ${acc.role === "main" ? "selected" : ""}>main — nhận vàng và đồ</option>
          </select></label>
      </div>
    </fieldset>
    <fieldset><legend>Thiết bị</legend>
      <div class="row">
        ${field("Index instance LDPlayer", "ldplayer.index", acc.ldplayer.index, { type: "number" })}
        ${field("ADB serial", "ldplayer.adb_serial", acc.ldplayer.adb_serial, { hint: "vd emulator-5554; mỗi instance một cổng" })}
      </div>
    </fieldset>
    <fieldset><legend>Đăng nhập</legend>
      ${field("Server", "login.server", acc.login.server, { hint: "đúng như hiển thị ở màn title, vd S9.Hàng Long(Mới)" })}
      <div class="row">
        ${field("Tài khoản 3CID", "login.username", acc.login.username, { hint: "để trống cả hai ô = dùng tài khoản SDK đã lưu trên máy" })}
        ${field("Mật khẩu", "login.password", acc.login.password, { type: "password" })}
      </div>
      ${field("Slot nhân vật (1 = trên cùng)", "login.character_slot", acc.login.character_slot, { type: "number" })}
    </fieldset>
    <fieldset><legend>Farm</legend>
      <div class="row">
        ${mapSelect("Map farm", "farm.map", acc.farm.map, maps, "toàn bộ map trong kho đã quét (tools/harvest_maps.py) + map có template thủ công")}
        <label><span>Điểm tap trên ảnh bản đồ — farm (pixel X / Y)</span>
          <span class="row" style="gap:8px">
            <input data-path="farm.spot.0" type="number" value="${acc.farm.spot[0]}">
            <input data-path="farm.spot.1" type="number" value="${acc.farm.spot[1]}">
            <button type="button" class="btn pick-spot" data-prefix="farm.spot">Chọn trên ảnh</button>
          </span>
          <span class="hint">0/0 = mặc định tap vào TÂM map đích. Muốn chọn điểm khác: đây là pixel màn hình (960x540) nơi tool tap lên ẢNH bản đồ (không phải toạ độ trong game) — mở màn bản đồ đúng map trong game rồi bấm "Chọn trên ảnh".</span></label>
      </div>
      <div class="row">
        ${field("Rút về khi HP dưới (%)", "farm.hp_retreat_percent", acc.farm.hp_retreat_percent, { type: "number", hint: "máu dưới mức này nhiều chu kỳ liền là về thành nghỉ" })}
        ${field("Quay lại farm khi HP đạt (%)", "farm.hp_resume_percent", acc.farm.hp_resume_percent, { type: "number", hint: "phải lớn hơn ngưỡng rút về" })}
      </div>
      <div class="row">
        ${mapSelect("Map rút về (thành)", "farm.retreat_map", acc.farm.retreat_map, maps, "nơi đứng nghỉ hồi máu, vd Tuyền Châu")}
        <label><span>Điểm tap trên ảnh bản đồ — nghỉ (pixel X / Y)</span>
          <span class="row" style="gap:8px">
            <input data-path="farm.retreat_spot.0" type="number" value="${acc.farm.retreat_spot[0]}">
            <input data-path="farm.retreat_spot.1" type="number" value="${acc.farm.retreat_spot[1]}">
            <button type="button" class="btn pick-spot" data-prefix="farm.retreat_spot">Chọn trên ảnh</button>
          </span>
          <span class="hint">0/0 = mặc định tap vào TÂM map thành; muốn chọn chỗ nghỉ khác thì mở màn bản đồ map thành rồi bấm "Chọn trên ảnh"</span></label>
      </div>
      ${field("Ngưỡng vàng chuyển về main", "farm.gold_transfer_threshold", acc.farm.gold_transfer_threshold, { type: "number", hint: "vượt mức này sẽ hẹn giao dịch với acc main" })}
    </fieldset>
    <button class="btn danger" id="btnDel">Xoá tài khoản này</button>
  </div>
  <div class="savebar">
    <span class="msg" id="msg">Chưa có thay đổi.</span>
    <button class="btn gold" id="btnSave">Lưu tài khoản</button>
  </div>`;
  wireAccountPage(acc);
}

function collect(acc) {
  const out = JSON.parse(JSON.stringify(acc));
  delete out.stem;
  for (const el of document.querySelectorAll("[data-path]")) {
    const keys = el.dataset.path.split(".");
    let node = out;
    while (keys.length > 1) node = node[keys.shift()];
    node[keys[0]] = el.type === "number" ? Number(el.value) : el.value;
  }
  return out;
}

// Công cụ chọn điểm tap, hai chế độ:
//  - map: điểm farm/rút (farm.spot, farm.retreat_spot) -> hiện ẢNH MAP đã quét
//    (data/maps, GET /api/maps) theo tên map đang chọn trong form; click ra
//    pixel MÀN HÌNH (cộng offset vùng ảnh bản đồ) + toạ độ TRONG GAME nếu map
//    đã hiệu chuẩn (tools/calibrate_map.py)
//  - live: các điểm HUD (ô chiêu...) -> chụp màn thiết bị như cũ
// Ảnh hiển thị có thể bị thu nhỏ nên phải quy đổi theo naturalWidth/clientWidth.
// stemOf(): tài khoản dùng khi chụp màn — trang tài khoản là chính nó,
// trang Chiêu là thiết bị được chọn trong dropdown.
let _mapLib = null;
const mapLib = async () => {
  if (!_mapLib) _mapLib = await api("GET", "/api/maps")
    .catch(() => ({ maps: [], map_image_rect: null }));
  return _mapLib;
};

function wireSpotPickers(stemOf) {
  const dlg = $("#dlgPick"), img = $("#pickImg"), dot = $("#pickDot");
  const xy = $("#pickXY"), ok = $("#pickOk"), msg = $("#pickMsg");
  const refresh = $("#pickRefresh");
  let picked = null, prefix = null, mode = "live", rect = null, calib = null;

  const reset = () => {
    picked = null; ok.disabled = true; dot.style.display = "none"; xy.textContent = "";
  };
  const loadLive = () => {
    mode = "live"; reset();
    msg.textContent = "Click lên ảnh để chọn điểm tap. Ảnh là màn hình thiết bị NGAY LÚC "
      + "NÀY — hãy mở sẵn màn bản đồ đúng map trong game trước.";
    refresh.textContent = "Chụp lại";
    img.src = `/api/accounts/${stemOf()}/screenshot?ts=${Date.now()}`;
  };
  const loadMap = async () => {
    const mapField = prefix === "farm.retreat_spot" ? "farm.retreat_map" : "farm.map";
    const sel = document.querySelector(`[data-path="${mapField}"]`);
    const name = sel ? sel.value : "";
    const lib = await mapLib();
    const entry = lib.maps.find((m) => m.name === name);
    if (!entry || !lib.map_image_rect) { loadLive(); return; }
    mode = "map"; rect = lib.map_image_rect; calib = entry.calibration || null; reset();
    msg.textContent = `Ảnh map "${name}" từ kho đã quét — click để chọn điểm. `
      + (calib ? "Map đã hiệu chuẩn: hiện kèm toạ độ trong game."
               : "(map chưa hiệu chuẩn — chỉ có pixel, chạy tools/calibrate_map.py để có toạ độ)");
    refresh.textContent = "Dùng ảnh thiết bị";
    img.src = `/api/maps/${entry.index}/image?ts=${Date.now()}`;
  };
  img.onerror = () => { msg.textContent = "Không tải được ảnh — thiết bị có đang chạy không?"; };
  img.onclick = (ev) => {
    const r = img.getBoundingClientRect();
    const scaleX = img.naturalWidth / r.width, scaleY = img.naturalHeight / r.height;
    let px = Math.round((ev.clientX - r.left) * scaleX);
    let py = Math.round((ev.clientY - r.top) * scaleY);
    if (mode === "map") { px += rect[0]; py += rect[1]; }
    picked = [px, py];
    dot.style.left = `${ev.clientX - r.left}px`; dot.style.top = `${ev.clientY - r.top}px`;
    dot.style.display = "block";
    let t = `pixel: ${px} / ${py}`;
    if (mode === "map" && calib) {
      const gx = Math.round(calib.sx * px + calib.ox);
      const gy = Math.round(calib.sy * py + calib.oy);
      t += `  —  toạ độ game: ${gx} / ${gy}`;
    }
    xy.textContent = t;
    ok.disabled = false;
  };
  // map -> chuyển sang ảnh thiết bị; live -> chụp lại (muốn quay về ảnh map
  // thì đóng dialog mở lại)
  refresh.onclick = loadLive;
  $("#pickCancel").onclick = () => dlg.close();
  ok.onclick = () => {
    if (!picked || !prefix) return;
    for (const i of [0, 1]) {
      const inp = document.querySelector(`[data-path="${prefix}.${i}"]`);
      inp.value = picked[i];
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    }
    dlg.close();
  };
  for (const btn of document.querySelectorAll(".pick-spot"))
    btn.onclick = () => {
      prefix = btn.dataset.prefix;
      if (prefix === "farm.spot" || prefix === "farm.retreat_spot") loadMap().catch(loadLive);
      else loadLive();
      dlg.showModal();
    };
}

function wireAccountPage(acc) {
  wireSpotPickers(() => acc.stem);
  for (const eye of document.querySelectorAll(".pw-eye")) {
    eye.onclick = () => {
      const inp = eye.parentElement.querySelector("input");
      inp.type = inp.type === "password" ? "text" : "password";
      eye.textContent = inp.type === "password" ? "hiện" : "ẩn";
    };
  }
  const msg = $("#msg");
  for (const el of document.querySelectorAll("[data-path], select[data-path]"))
    el.addEventListener("input", () => { msg.textContent = "Có thay đổi chưa lưu."; msg.className = "msg"; });
  $("#btnSave").onclick = async () => {
    const btn = $("#btnSave");
    try {
      btn.disabled = true;
      await api("PUT", `/api/accounts/${acc.stem}`, collect(acc));
      msg.textContent = "Đã lưu vào file."; msg.className = "msg ok";
      refreshList();
      // runner đọc cấu hình lúc khởi động — đang chạy thì chạy lại để áp dụng
      const st = await api("GET", "/api/runner").catch(() => ({ running: false }));
      if (st.running) {
        msg.textContent = "Đã lưu — đang khởi động lại runner với cấu hình mới (dừng sạch ở điểm an toàn, tối đa ~60s)...";
        await api("POST", "/api/runner/restart", { account: acc.stem });
        msg.textContent = "Đã lưu và chạy lại runner với cấu hình mới ✓"; msg.className = "msg ok";
      }
    } catch (e) { msg.textContent = errText(e); msg.className = "msg err"; }
    finally { btn.disabled = false; }
  };
  $("#btnDel").onclick = async () => {
    if (!confirm(`Xoá file tài khoản ${acc.stem}.yaml? Hành động này không hoàn tác được.`)) return;
    await api("DELETE", `/api/accounts/${acc.stem}`);
    current = null; await refreshList(false); renderEmpty();
  };
}

async function openAccount(stem) {
  current = stem;
  await refreshList();
  try {
    const [acc, maps] = await Promise.all([
      api("GET", `/api/accounts/${stem}`),
      api("GET", "/api/farm-maps").catch(() => []),
    ]);
    renderAccount(acc, maps);
  }
  catch (e) {
    $("#main").innerHTML = `<div class="empty"><h2>File ${stem}.yaml không đọc được</h2>
      <p>${errText(e)}</p><p>Sửa tay file này hoặc xoá rồi tạo lại từ giao diện.</p>
      <button class="btn danger" onclick="api('DELETE','/api/accounts/${stem}').then(()=>{current=null;refreshList(false);renderEmpty()})">Xoá file hỏng</button></div>`;
  }
}

function renderEmpty() {
  $("#main").innerHTML = `<div class="empty">
    <h2>Chọn một tài khoản để cấu hình</h2>
    <p>Mỗi tài khoản là một file YAML trong <code>config/accounts/</code>. Giao diện này
    đọc và ghi đúng các file đó — sửa tay bằng editor vẫn hoạt động như thường.</p>
    <p>Bắt đầu bằng nút <b>Thêm tài khoản</b> ở góc trái dưới.</p></div>`;
}

/* ---- tab Chiêu (auto nhấn chiêu + vật phẩm hồi máu) ---- */
async function renderSkills() {
  const [s, accs] = await Promise.all([
    api("GET", "/api/settings/farm-skills"),
    api("GET", "/api/accounts").catch(() => []),
  ]);
  const devOpts = accs.filter((a) => !a.error).map((a) =>
    `<option value="${a.stem}">${a.name} (${a.adb_serial})</option>`).join("");
  const healOpts = [0,1,2,3,4,5,6,7,8].map((n) =>
    `<option value="${n}" ${n === s.heal_slot ? "selected" : ""}>${n === 0 ? "Không dùng" : "Ô " + n}</option>`).join("");
  const slotRows = [1,2,3,4,5,6,7,8].map((n) => `
    <div class="row" style="align-items:center; margin-bottom:6px">
      <label class="toggle" style="flex:0 0 150px; margin:0">
        <input type="checkbox" data-slot="${n}" ${s.slots.includes(n) ? "checked" : ""}>
        <span>Ô ${n}${n === 8 ? ' <span class="sub">trên cùng — vật phẩm</span>' : ""}</span>
      </label>
      <input data-path="slot_points.${n-1}.0" type="number" value="${s.slot_points[n-1][0]}" style="width:90px; flex:none">
      <input data-path="slot_points.${n-1}.1" type="number" value="${s.slot_points[n-1][1]}" style="width:90px; flex:none">
      <button type="button" class="btn pick-spot" data-prefix="slot_points.${n-1}">Chọn trên ảnh</button>
    </div>`).join("");
  $("#main").innerHTML = `
  <div class="page">
    <h2>Auto nhấn chiêu</h2>
    <p class="lead">Mục <code>farm.skills</code> của <code>config/settings.yaml</code> + toạ độ 8 ô trong
    <code>config/coordinates.yaml</code> — dùng chung cho mọi acc farm (cùng môn phái).</p>
    <fieldset><legend>Chế độ</legend>
      <label class="toggle"><input type="checkbox" data-k="enabled" ${s.enabled ? "checked" : ""}>
        <span>Bật auto nhấn chiêu khi farm<span class="sub">xoay vòng các ô đã tích bên dưới; chiêu đang hồi thì cú tap vô hại</span></span></label>
      ${field("Giãn cách giữa 2 lần nhấn chiêu (giây)", "cast_interval", s.cast_interval,
        { type: "number", step: "any", hint: "sàn thực tế do giới hạn an toàn (nghỉ giữa thao tác + thao tác/phút) quyết định — đặt nhỏ hơn cũng không nhanh hơn" })}
    </fieldset>
    <fieldset><legend>Vật phẩm hồi máu</legend>
      <div class="row">
        <label><span>Ô chứa vật phẩm hồi máu</span>
          <select data-k2="heal_slot">${healOpts}</select>
          <span class="hint">ô này KHÔNG xoay vòng — chỉ nhấn khi máu tụt dưới ngưỡng</span></label>
        ${field("Dùng khi HP dưới (%)", "heal_hp_percent", s.heal_hp_percent,
          { type: "number", hint: "nên cao hơn ngưỡng rút về của acc: thuốc cứu trước, hết cứu nổi mới rút" })}
        ${field("Giãn cách 2 lần dùng thuốc (giây)", "heal_cooldown", s.heal_cooldown, { type: "number", step: "any" })}
      </div>
    </fieldset>
    <fieldset><legend>Vị trí 8 ô trên vòng chiêu (pixel X / Y, màn 960x540)</legend>
      <label><span>Thiết bị chụp màn hình để chọn điểm</span>
        <select id="skillDev">${devOpts || '<option value="">— chưa có tài khoản —</option>'}</select>
        <span class="hint">mở game vào thế giới (vòng chiêu hiện rõ) rồi bấm "Chọn trên ảnh" từng ô; tích chọn = ô nằm trong vòng xoay chiêu</span></label>
      ${slotRows}
    </fieldset>
  </div>
  <div class="savebar">
    <span class="msg" id="msg">Chưa có thay đổi.</span>
    <button class="btn gold" id="btnSaveSkill">Lưu cấu hình chiêu</button>
  </div>`;

  wireSpotPickers(() => $("#skillDev").value);
  const msg = $("#msg");
  for (const el of document.querySelectorAll("[data-k],[data-k2],[data-path],[data-slot]"))
    el.addEventListener("input", () => { msg.textContent = "Có thay đổi chưa lưu."; msg.className = "msg"; });
  $("#btnSaveSkill").onclick = async () => {
    const body = {
      enabled: $('[data-k="enabled"]').checked,
      slots: [...document.querySelectorAll("[data-slot]")]
        .filter((el) => el.checked).map((el) => Number(el.dataset.slot)),
      cast_interval: Number($('[data-path="cast_interval"]').value),
      heal_slot: Number($('[data-k2="heal_slot"]').value),
      heal_hp_percent: Number($('[data-path="heal_hp_percent"]').value),
      heal_cooldown: Number($('[data-path="heal_cooldown"]').value),
      slot_points: [0,1,2,3,4,5,6,7].map((i) => [
        Number(document.querySelector(`[data-path="slot_points.${i}.0"]`).value),
        Number(document.querySelector(`[data-path="slot_points.${i}.1"]`).value),
      ]),
    };
    try {
      await api("PUT", "/api/settings/farm-skills", body);
      const st = await api("GET", "/api/runner").catch(() => ({ running: false }));
      msg.textContent = st.running
        ? "Đã lưu — runner đang chạy đọc cấu hình lúc khởi động, hãy chạy lại runner (lưu lại ở tab Tài khoản) để áp dụng."
        : "Đã lưu vào settings.yaml + coordinates.yaml.";
      msg.className = "msg ok";
    } catch (e) { msg.textContent = errText(e); msg.className = "msg err"; }
  };
}

/* ---- tab Thiết bị (worker theo từng tài khoản — W2) ---- */
let devTimer = null;
// thông báo thao tác gần nhất — giữ qua các lần tự làm mới (re-render xoá DOM)
let devMsg = "", devMsgErr = false;

async function renderWorkers() {
  const rows = await api("GET", "/api/workers");
  const fmt = (w) => {
    if (w.error) return `<span style="color:var(--red)">file lỗi</span>`;
    if (!w.running) return `<span style="color:var(--ink-dim)">dừng</span>`;
    const st = w.state || {};
    const where = st.task ? ` — ${st.task}/${st.state || "?"}` : "";
    return `<span style="color:var(--jade)">đang chạy</span>`
      + `<span class="meta" style="font-family:var(--mono)"> pid ${w.pid}${where}</span>`;
  };
  const items = rows.map((w) => `
    <fieldset style="margin-bottom:12px">
      <div class="row" style="align-items:center">
        <div style="flex:2">
          <b>${w.name || w.stem}</b>
          <span class="meta" style="display:block; color:var(--ink-dim); font-family:var(--mono); font-size:12.5px">
            ${w.stem}.yaml · ${w.adb_serial || "?"} · máy #${w.ldplayer_index ?? "?"}</span>
        </div>
        <div style="flex:2">${fmt(w)}</div>
        <div style="flex:3; display:flex; gap:8px; justify-content:flex-end">
          ${w.running
            ? `<button class="btn" data-op="restart" data-stem="${w.stem}">Chạy lại</button>
               <button class="btn danger" data-op="stop" data-stem="${w.stem}">Dừng</button>`
            : `<button class="btn gold" data-op="start" data-stem="${w.stem}">Mở &amp; đăng nhập</button>
               <button class="btn" data-op="provision" data-stem="${w.stem}" title="Nhân bản instance LDPlayer mẫu cho acc này (chỉ trên server Windows)">Cấp máy mới</button>`}
        </div>
      </div>
    </fieldset>`).join("");
  $("#main").innerHTML = `
  <div class="page" style="max-width:760px">
    <h2>Thiết bị &amp; worker</h2>
    <p class="lead">Mỗi tài khoản một tiến trình worker riêng (<code>python -m vhtk.worker</code>).
    "Dừng" tạo kill-switch <code>STOP.&lt;acc&gt;</code> — worker dừng sạch ở điểm an toàn,
    các worker khác không bị ảnh hưởng. Tự làm mới mỗi 5 giây.</p>
    <div id="workerMsg" class="msg" style="color:${devMsgErr ? "var(--red)" : "var(--ink-dim)"}; margin-bottom:12px">${devMsg}</div>
    ${items || '<p class="lead">Chưa có tài khoản nào — tạo ở tab Tài khoản trước.</p>'}
  </div>`;
  const setMsg = (text, isErr) => {
    devMsg = text; devMsgErr = !!isErr;
    const el = $("#workerMsg");
    if (el) { el.textContent = text; el.style.color = isErr ? "var(--red)" : "var(--ink-dim)"; }
  };
  for (const btn of document.querySelectorAll("[data-op]"))
    btn.onclick = async () => {
      const { op, stem } = btn.dataset;
      if (op === "stop" && !confirm(`Dừng worker ${stem}? (dừng sạch ở điểm an toàn, có thể mất tới 2 phút)`)) return;
      btn.disabled = true;
      setMsg(`Đang ${op === "stop" ? "dừng" : "khởi động"} ${stem}... (mở máy + đăng nhập có thể mất vài phút)`);
      try {
        const r = await api("POST", `/api/workers/${stem}/${op}`);
        setMsg(`${stem}: ${r.status}${r.pid ? ` (pid ${r.pid})` : ""} ✓`);
      } catch (e) { setMsg(`${stem}: ${errText(e)}`, true); }
      if (tab === "dev") renderWorkers().catch(renderError);
    };
}

/* ---- tab An toàn ---- */
function sealFor(s) {
  if (s.dry_run) return ["safe", "Chạy khô (dry run)",
    "Mọi hành động không thể hoàn tác — bán, mua, giao dịch — chỉ được chụp màn và ghi log, không thực hiện."];
  if (s.confirm_mode) return ["warn", "Chạy thật, có người duyệt",
    "Bán đồ và chuyển vàng sẽ THỰC HIỆN sau khi được duyệt từng lệnh. Hết giờ chờ tính là từ chối."];
  return ["danger", "Chạy thật, không người duyệt",
    "Tool tự bán, mua và chuyển vàng mà không hỏi lại. Chỉ bật khi đã tin tưởng hoàn toàn sau thời gian dài theo dõi."];
}

async function renderSafety() {
  const s = await api("GET", "/api/settings/safety");
  const [cls, title, desc] = sealFor(s);
  $("#main").innerHTML = `
  <div class="page">
    <h2>An toàn</h2>
    <p class="lead">Mục <code>safety</code> của <code>config/settings.yaml</code> — áp dụng cho mọi tài khoản.</p>
    <div class="seal ${cls}" id="seal"><b>${title}</b>${desc}</div>
    <fieldset><legend>Chế độ</legend>
      <label class="toggle"><input type="checkbox" data-k="dry_run" ${s.dry_run ? "checked" : ""}>
        <span>Chạy khô (dry run)<span class="sub">tắt đi là tool bắt đầu bán/mua/giao dịch thật</span></span></label>
      <label class="toggle"><input type="checkbox" data-k="confirm_mode" ${s.confirm_mode ? "checked" : ""}>
        <span>Duyệt từng lệnh<span class="sub">gửi ảnh và chờ xác nhận trước khi bán đồ / chuyển vàng</span></span></label>
      ${field("Chờ duyệt tối đa (giây) — hết giờ coi như từ chối", "confirm_timeout_seconds", s.confirm_timeout_seconds, { type: "number", step: "any" })}
    </fieldset>
    <fieldset><legend>Giới hạn</legend>
      <div class="row">
        ${field("Thao tác tối đa mỗi phút", "max_actions_per_minute", s.max_actions_per_minute, { type: "number" })}
        ${field("Hành động không hoàn tác tối đa / phiên", "max_irreversible_per_session", s.max_irreversible_per_session, { type: "number" })}
      </div>
      <div class="row">
        ${field("Số lần tự phục hồi liên tiếp tối đa", "max_recover_attempts", s.max_recover_attempts, { type: "number" })}
        ${field("File dừng khẩn cấp", "kill_switch_file", s.kill_switch_file, { hint: "tạo file tên này ở thư mục gốc là mọi task dừng sạch" })}
      </div>
      <div class="row">
        ${field("Nghỉ giữa thao tác — ít nhất (giây)", "action_delay.min_seconds", s.action_delay.min_seconds, { type: "number", step: "any" })}
        ${field("— nhiều nhất (giây)", "action_delay.max_seconds", s.action_delay.max_seconds, { type: "number", step: "any" })}
      </div>
    </fieldset>
  </div>
  <div class="savebar">
    <span class="msg" id="msg">Chưa có thay đổi.</span>
    <button class="btn gold" id="btnSaveSafe">Lưu cài đặt an toàn</button>
  </div>`;

  const collectSafety = () => {
    const out = JSON.parse(JSON.stringify(s));
    for (const el of document.querySelectorAll("[data-k]")) out[el.dataset.k] = el.checked;
    for (const el of document.querySelectorAll("[data-path]")) {
      const keys = el.dataset.path.split(".");
      let node = out;
      while (keys.length > 1) node = node[keys.shift()];
      node[keys[0]] = el.type === "number" ? Number(el.value) : el.value;
    }
    return out;
  };
  const msg = $("#msg");
  const repaint = () => {
    const [cls2, t2, d2] = sealFor(collectSafety());
    const seal = $("#seal");
    seal.className = `seal ${cls2}`; seal.innerHTML = `<b>${t2}</b>${d2}`;
    msg.textContent = "Có thay đổi chưa lưu."; msg.className = "msg";
  };
  for (const el of document.querySelectorAll("[data-k],[data-path]")) el.addEventListener("input", repaint);
  $("#btnSaveSafe").onclick = async () => {
    try {
      await api("PUT", "/api/settings/safety", collectSafety());
      msg.textContent = "Đã lưu vào settings.yaml."; msg.className = "msg ok";
    } catch (e) { msg.textContent = errText(e); msg.className = "msg err"; }
  };
}

/* ---- điều hướng ---- */
// lỗi tải trang (server cũ thiếu endpoint, server chết...) phải HIỆN RA,
// không được nuốt im lặng — người dùng tưởng bấm không ăn
function renderError(e) {
  $("#main").innerHTML = `<div class="empty"><h2>Không tải được trang</h2>
    <p>${errText(e)}</p>
    <p>Hay gặp nhất: app quản lý đang chạy bằng phiên bản cũ — chạy lại bằng
    <code>./vhtk restart</code> rồi tải lại trang này.</p></div>`;
}
function switchTab(name, render) {
  tab = name; paintTabs();
  if (devTimer) { clearInterval(devTimer); devTimer = null; }
  render();
  if (name === "dev")
    devTimer = setInterval(() => { if (tab === "dev") renderWorkers().catch(() => {}); }, 5000);
}
$("#tabAcc").onclick = () => switchTab("acc", () => current ? openAccount(current) : renderEmpty());
$("#tabDev").onclick = () => switchTab("dev", () => renderWorkers().catch(renderError));
$("#tabSkill").onclick = () => switchTab("skill", () => renderSkills().catch(renderError));
$("#tabSafe").onclick = () => switchTab("safe", () => renderSafety().catch(renderError));
function paintTabs() {
  $("#tabAcc").classList.toggle("on", tab === "acc");
  $("#tabDev").classList.toggle("on", tab === "dev");
  $("#tabSkill").classList.toggle("on", tab === "skill");
  $("#tabSafe").classList.toggle("on", tab === "safe");
}
$("#btnNew").onclick = () => { $("#newStem").value = ""; $("#dlgNew").showModal(); };
$("#dlgNew").addEventListener("close", async () => {
  if ($("#dlgNew").returnValue !== "ok") return;
  const stem = $("#newStem").value.trim();
  if (!stem) return;
  try {
    const tpl = await api("GET", "/api/accounts-template").catch(() => null);
    const body = tpl || { name: stem, role: "farm",
      ldplayer: { index: 0, adb_serial: "emulator-5554" },
      login: { server: "", username: "", password: "", character_slot: 1 },
      farm: { map: "", spot: [0, 0], hp_retreat_percent: 30, hp_resume_percent: 90,
              retreat_map: "", retreat_spot: [0, 0], gold_transfer_threshold: 1000000 } };
    body.name = stem;
    await api("POST", `/api/accounts/${stem}`, body);
    tab = "acc"; paintTabs(); await openAccount(stem);
  } catch (e) { alert(errText(e)); }
});

refreshList(false).then(renderEmpty);
</script>
