[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vhtk2-auto"
version = "0.1.0"
description = "Orchestration tool for VHTK2 Mobile in-game auto, driven via ADB on LDPlayer 9"
requires-python = ">=3.11"
dependencies = [
    "adbutils>=2.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "paddleocr>=2.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "structlog>=24.1",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "ruamel.yaml>=0.18",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Cửa sổ desktop cho app quản lý; thiếu thì UI tự mở bằng trình duyệt
desktop = ["pywebview>=5.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vhtk"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["vhtk"]
strict = true
# Các thư viện chưa có type stub đầy đủ
[[tool.mypy.overrides]]
module = ["adbutils.*", "cv2.*", "paddleocr.*", "ruamel.*", "webview.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
